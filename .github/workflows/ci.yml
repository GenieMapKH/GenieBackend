name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & test all services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (generates Prisma client, compiles every service)
        run: npm run build

      - name: Test
        run: npm test

      # Stop releases containing known high or critical production vulnerabilities.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        service: [authentication, user, property, chat, payment, notification, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg SERVICE=${{ matrix.service }} -t tilomnov-${{ matrix.service }}:ci .
