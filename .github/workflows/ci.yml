name: CI

permissions:
  contents: read

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & test all services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (generates Prisma client, compiles every service)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test RabbitMQ delivery and recovery with isolated databases
        run: |
          docker compose -f qa/messaging/docker-compose.yml up -d --wait
          npm run test:messaging:integration
          npm run test:messaging:flows
          npm run test:security:integration
          npm ci --prefix qa/parity
          npm run test:app:flows

      - name: Remove messaging test containers
        if: always()
        run: docker compose -f qa/messaging/docker-compose.yml down --volumes

      # Stop releases containing known high or critical production vulnerabilities.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        service: [authentication, user, property, chat, payment, notification, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg SERVICE=${{ matrix.service }} -t tilomnov-${{ matrix.service }}:ci .

      - name: Broker bootstrap image builds
        if: matrix.service == 'api-gateway'
        run: docker build --target broker-bootstrap -t tilomnov-broker-bootstrap:ci .

  deploy-staging:
    name: Deploy branch to staging
    # Staging is optional until its environment-scoped credentials are configured.
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && vars.RAILWAY_PROJECT_ID != '' && vars.RAILWAY_STAGING_ENVIRONMENT != ''
    needs: [build-and-test, docker]
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: railway-staging-deploy
      cancel-in-progress: false
    timeout-minutes: 45
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_STAGING_ENVIRONMENT: ${{ vars.RAILWAY_STAGING_ENVIRONMENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy all backend services to staging
        shell: bash
        run: |
          set -euo pipefail
          : "${RAILWAY_TOKEN:?Add the staging-scoped Railway token as RAILWAY_STAGING_TOKEN}"
          : "${RAILWAY_PROJECT_ID:?Set the GitHub Actions variable RAILWAY_PROJECT_ID}"
          : "${RAILWAY_STAGING_ENVIRONMENT:?Set the GitHub Actions variable RAILWAY_STAGING_ENVIRONMENT}"
          for service in Authentication Users property Chat payment Notification Gateway; do
            railway up --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_STAGING_ENVIRONMENT" --service "$service"
          done
