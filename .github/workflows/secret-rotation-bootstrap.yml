name: Secret rotation bootstrap

# One-time setup only; the nightly rotation never receives the admin URL.
on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Initialize rotating database logins (migration 36 must already be applied)'
        type: choice
        default: all
        options:
          - all
          - authentication
          - user
          - property
          - chat
          - payment
          - notification

permissions:
  contents: read

concurrency:
  group: secret-rotation
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      INFISICAL_API_URL: ${{ vars.INFISICAL_API_URL }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
      INFISICAL_ENVIRONMENT: ${{ vars.INFISICAL_ENVIRONMENT }}
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the settings
        env:
          ADMIN_DATABASE_URL: ${{ secrets.ROTATION_ADMIN_DATABASE_URL }}
        run: |
          for name in INFISICAL_PROJECT_ID INFISICAL_CLIENT_ID INFISICAL_CLIENT_SECRET ADMIN_DATABASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Set $name (ADMIN_DATABASE_URL comes from the ROTATION_ADMIN_DATABASE_URL secret; see docs/SECRET_ROTATION.md)."
              exit 1
            fi
          done
      - name: Install
        run: npm ci --ignore-scripts
      - name: Initialize database logins
        env:
          ADMIN_DATABASE_URL: ${{ secrets.ROTATION_ADMIN_DATABASE_URL }}
          SERVICE: ${{ inputs.service }}
        run: |
          args=()
          case "$SERVICE" in
            all) ;;
            authentication|user|property|chat|payment|notification) args+=("--only=$SERVICE") ;;
            *) echo "::error::Unknown service"; exit 1 ;;
          esac
          node scripts/secret-rotation/bootstrap.js "${args[@]}"
