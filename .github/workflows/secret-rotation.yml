name: Secret rotation

# Every night: rotate the production secrets that are due (every 30 days):
# each service's database password, INTERNAL_SERVICE_SECRET and
# JWT_KEY_ENCRYPTION_KEY. New values go to Infisical; its Railway syncs
# deliver them. A failed run never leaves a service without a working
# credential: it stops before changing anything in use (docs/SECRET_ROTATION.md).

on:
  schedule:
    # 20:30 UTC is 03:30 in Cambodia, after the 02:00 backup.
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these, comma-separated: authentication,user,property,chat,payment,notification,shared (empty = all)'
        required: false
        default: ''
      force:
        description: 'Rotate even if not due yet'
        type: boolean
        default: false
      dry_run:
        description: 'Only list what is due'
        type: boolean
        default: false

permissions:
  contents: read

# Never two rotations at once.
concurrency:
  group: secret-rotation
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      INFISICAL_API_URL: ${{ vars.INFISICAL_API_URL }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
      INFISICAL_ENVIRONMENT: ${{ vars.INFISICAL_ENVIRONMENT }}
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      SECRET_ROTATION_DAYS: ${{ vars.SECRET_ROTATION_DAYS }}
      ROTATION_RAILWAY_TOKEN: ${{ secrets.ROTATION_RAILWAY_TOKEN }}
      ROTATION_RAILWAY_PROJECT_ID: ${{ vars.ROTATION_RAILWAY_PROJECT_ID }}
      ROTATION_RAILWAY_ENVIRONMENT_ID: ${{ vars.ROTATION_RAILWAY_ENVIRONMENT_ID }}
      ROTATION_RAILWAY_SERVICE_IDS: ${{ vars.ROTATION_RAILWAY_SERVICE_IDS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the settings
        run: |
          for name in INFISICAL_PROJECT_ID INFISICAL_CLIENT_ID INFISICAL_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Set $name (docs/SECRET_ROTATION.md)."; exit 1
            fi
          done

      - name: Install
        run: npm ci --ignore-scripts

      - name: Rotate
        env:
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$ONLY" ]; then
            if [[ ! "$ONLY" =~ ^[a-z,]+$ ]]; then echo "::error::'only' takes names separated by commas."; exit 1; fi
            args+=("--only=$ONLY")
          fi
          [ "$FORCE" = "true" ] && args+=(--force)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          node scripts/secret-rotation/run.js "${args[@]}"
