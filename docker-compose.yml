# One container per service, so a service that crashes or is redeployed only
# takes down its own routes. Every service is built from the same Dockerfile.
#
#   docker compose up -d --build     build changed layers and start changed services
#   docker compose up -d --build --no-deps chat   rebuild/start only chat
#   docker compose logs -f chat      follow one service's logs
#   docker compose restart chat      restart one service, the others keep running
#   docker compose down              stop and remove
#
# If you used the older single-container setup, remove its container first:
#   docker compose down --remove-orphans
#
# `restart: unless-stopped` brings each service back by itself, on its own.
# Only the gateway publishes a port; the rest are reachable by name inside the
# compose network. Service-to-service calls are signed with INTERNAL_SERVICE_SECRET.
# Local builds omit provenance so cached rebuilds keep stable image IDs.

x-service: &service
  restart: unless-stopped
  env_file:
    - .env
  environment: &shared-environment
    REDIS_URL: redis://redis:6379
    AUTH_SERVICE_URL: http://authentication:4001
    USER_SERVICE_URL: http://user:4002
    PROPERTY_SERVICE_URL: http://property:4003
    CHAT_SERVICE_URL: http://chat:4004
    PAYMENT_SERVICE_URL: http://payment:4005
    NOTIFICATION_SERVICE_URL: http://notification:4006
    INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET in .env (32+ characters)}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Capped, and the least recently used keys go first. Nothing here is the only copy of anything.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  authentication:
    <<: *service
    build: { context: ., provenance: false, args: { SERVICE: authentication } }
    environment:
      <<: *shared-environment
      PORT: "4001"
      # Its own database login (migration 34); the shared one until that is set.
      DATABASE_URL: ${AUTHENTICATION_DATABASE_URL:-${DATABASE_URL}}

  user:
    <<: *service
    build: { context: ., provenance: false, args: { SERVICE: user } }
    environment:
      <<: *shared-environment
      PORT: "4002"
      DATABASE_URL: ${USER_DATABASE_URL:-${DATABASE_URL}}

  property:
    <<: *service
    build: { context: ., provenance: false, args: { SERVICE: property } }
    environment:
      <<: *shared-environment
      PORT: "4003"
      DATABASE_URL: ${PROPERTY_DATABASE_URL:-${DATABASE_URL}}

  chat:
    <<: *service
    build: { context: ., provenance: false, args: { SERVICE: chat } }
    environment:
      <<: *shared-environment
      PORT: "4004"
      DATABASE_URL: ${CHAT_DATABASE_URL:-${DATABASE_URL}}

  payment:
    <<: *service
    build: { context: ., provenance: false, args: { SERVICE: payment } }
    environment:
      <<: *shared-environment
      PORT: "4005"
      DATABASE_URL: ${PAYMENT_DATABASE_URL:-${DATABASE_URL}}

  notification:
    <<: *service
    build: { context: ., provenance: false, args: { SERVICE: notification } }
    environment:
      <<: *shared-environment
      PORT: "4006"
      DATABASE_URL: ${NOTIFICATION_DATABASE_URL:-${DATABASE_URL}}

  api-gateway:
    <<: *service
    build: { context: ., provenance: false, args: { SERVICE: api-gateway } }
    ports:
      - "4000:4000"
    environment:
      <<: *shared-environment
      PORT: "4000"
