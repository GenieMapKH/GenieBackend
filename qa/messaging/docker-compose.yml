name: tilomnov-messaging-test
services:
  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    hostname: messaging-test-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: messaging_test
      RABBITMQ_DEFAULT_PASS: messaging_test
      RABBITMQ_DEFAULT_VHOST: tilomnov-test
    ports:
      - "127.0.0.1:5679:5672"
      - "127.0.0.1:15679:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: messaging_test
      POSTGRES_USER: messaging_test
      POSTGRES_PASSWORD: messaging_test
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messaging_test -d messaging_test"]
      interval: 5s
      timeout: 3s
      retries: 20
